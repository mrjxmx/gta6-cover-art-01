<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Panels — Cover Art Studio</title>
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Neon Panels</h1>
    <p>Cover art studio — your photos, poster panels, one PNG.</p>
  </div>
  <button id="exportButton" type="button" class="export-top">Export PNG</button>
</header>
<main class="studio">
  <section class="stage-wrap" id="dropZone">
    <canvas id="stage" width="1920" height="1080" aria-label="Cover preview"></canvas>
    <p class="drop-hint">Drop photos anywhere here</p>
  </section>
  <aside class="controls">
    <section class="control-group">
      <h2>1 · Photos</h2>
      <label class="file-label">Add your photos
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>
      <div id="photoPool" class="photo-pool"></div>
      <button id="sampleButton" type="button" class="ghost">Add the sample photos</button>
      <div class="segmented" role="group" aria-label="Photo mode">
        <button id="modePanels" type="button" class="active">A photo per panel</button>
        <button id="modeSpread" type="button">One photo, spread</button>
      </div>
    </section>
    <section class="control-group">
      <h2>2 · Panels</h2>
      <div id="layoutButtons" class="layout-buttons"></div>
      <p id="panelLabel" class="panel-label"></p>
      <label class="slider-label">Zoom
        <input id="zoomRange" type="range" min="1" max="4" step="0.01" value="1">
      </label>
      <div class="row">
        <button id="resetCropButton" type="button" class="ghost">Reset crop</button>
        <button id="clearPanelButton" type="button" class="ghost">Clear panel</button>
      </div>
    </section>
    <section class="control-group">
      <h2>3 · Colour grade</h2>
      <div id="gradeButtons" class="grade-buttons"></div>
    </section>
    <section class="control-group">
      <h2>4 · Caption</h2>
      <label>Title (one line per row)
        <textarea id="captionInput" rows="2" maxlength="60">VICE
HEAT</textarea>
      </label>
      <label>Tagline
        <input id="taglineInput" type="text" maxlength="48" value="Welcome to Neon Shores">
      </label>
      <div class="row">
        <label>Lettering
          <select id="titleStyleSelect"></select>
        </label>
        <label>Position
          <select id="captionPosSelect">
            <option value="bottom" selected>Bottom</option>
            <option value="top">Top</option>
          </select>
        </label>
      </div>
    </section>
    <section class="control-group">
      <h2>5 · Export</h2>
      <div id="sizeButtons" class="size-buttons"></div>
      <p id="statusLine" role="status" class="status">Pick a photo, arrange the panels, export.</p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
